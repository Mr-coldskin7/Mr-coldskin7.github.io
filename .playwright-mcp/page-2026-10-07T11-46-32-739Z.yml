            - generic [ref=e496]: 附：长程Agent评测开源领域的行业调研
        - list [ref=e497]:
          - listitem [ref=e498]:
            - generic [ref=e500]:
              - strong [ref=e501]: 任务（Task，也称 Problem 或 Test Case）
              - text: ：具有明确输入和成功标准的单个测试。每次尝试任务的行动称为试验（Trial）。由于模型输出在不同运行之间会有变化，我们运行多次试验以产生更一致的结果。
          - listitem [ref=e502]:
            - generic [ref=e504]:
              - strong [ref=e505]: 评分器（Grader）
              - text: 是评估Agent性能某些方面的逻辑。一个任务可以有多个评分器，每个评分器包含多个断言（有时称为检查 Checks）。
          - listitem [ref=e506]:
            - generic [ref=e508]:
              - strong [ref=e509]: 记录（Transcript，也称 Trace 或 Trajectory）
              - text: ：试验的完整记录，包括输出、工具调用、推理、中间结果和任何其他交互。
          - listitem [ref=e510]:
