        - paragraph [ref=e402]: prompt定义了我们的问题/诉求，expeted behavior定义了我们预期Agent达成的行为，当我们在正式或测试环境中向Agent发送promt，通过trace获取到长程Agent真实的执行路径，就可以得到（prompt - expeted_behavior - trace）三元组，类似于短程Agent的（query - ground_truth - answer），即可进行评测。
        - paragraph [ref=e403]:
          - strong [ref=e404]: 3.2.3 长程Agent评测与短程Agent评测的差异
        - paragraph [ref=e405]: 可以把两者的差异总结如下：
