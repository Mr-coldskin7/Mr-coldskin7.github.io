        - heading "四、总结：Agent评测正在从打分动作走向基础设施能力" [level=2] [ref=e470]
        - paragraph [ref=e473]: 综合来看，随着大模型能力的增强以及Agent Harness的持续演进，Agent 评测的演进可以概括为两句话：
        - paragraph [ref=e474]:
          - strong [ref=e475]: 第一，评测对象变了
        - paragraph [ref=e476]: 过去评测的是“回答”，现在评测的是“任务系统”。
        - paragraph [ref=e477]: 因此我们关心的不再只是输出内容本身，而是完整执行链路中的能力、稳定性、效率与风险。
